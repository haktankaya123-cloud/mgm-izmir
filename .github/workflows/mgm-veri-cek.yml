name: MGM Veri Cek

on:
  schedule:
    # Her saatin 55. dakikasında (UTC)
    # Türkiye saatiyle XX:55'te çeker
    # yagis00Now verisi saat başına yakın daha doğru olur
    - cron: '55 * * * *'
  workflow_dispatch:

jobs:
  veri-cek:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Veriyi çek
        run: python mgm-veri.py --sessiz

      - name: index.js değiştiyse repoya kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "MGM veri guncelleme $(TZ='Europe/Istanbul' date +'%Y-%m-%d %H:%M') (TR)"
          git push
